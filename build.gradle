plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'me.royalgz'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Compile to Java 21 to match Paper API requirements
    options.release = 21
}

tasks.named('jar') {
    archiveBaseName.set('ZaynixJoins')
}

// Configure Shadow to produce a fat jar including HikariCP and SQLite driver
shadowJar {
    archiveBaseName.set('ZaynixJoins')
    mergeServiceFiles()
    // No relocations for now to avoid ASM remapping of Java 21 classfiles
}

// Make `build` produce the shaded jar
tasks.build {
    dependsOn tasks.shadowJar
}
